name: CI

on:
  push:
  pull_request:

jobs:
  build-test-lint:
    name: Build, Test, Lint
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

      - name: Lint
        run: swift format lint --strict --recursive Package.swift Sources Tests
